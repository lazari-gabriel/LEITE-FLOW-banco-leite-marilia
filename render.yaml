# Blueprint de deploy online gratuito/gerenciado no Render (Backend + PostgreSQL)
# O Frontend continua hospedado na Vercel apontando VITE_API_BASE_URL para este serviço.
databases:
  - name: leiteflow-db
    plan: free
    databaseName: leiteflow
    user: leiteflow

services:
  - type: web
    name: leiteflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_URL
        fromDatabase:
          name: leiteflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: CORS_ORIGIN
        sync: false
